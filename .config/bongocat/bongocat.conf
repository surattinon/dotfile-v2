# ═══════════════════════════════════════════════════════════════════════════
# BONGO CAT CONFIG - Minimal defaults, uncomment to customize
# ═══════════════════════════════════════════════════════════════════════════

# Position & Size
cat_height=55
cat_align=right
cat_x_offset=40
# cat_y_offset=0

# Appearance
enable_antialiasing=1
overlay_height=57
overlay_opacity=0
overlay_position=bottom
# mirror_x=0
# mirror_y=0

# Input devices
keyboard_device=/dev/input/event3
keyboard_device=/dev/input/event6
keyboard_device=/dev/input/event7
keyboard_name=AT Translated Set 2 keyboard
keyboard_name=BY Tech NuPhy Halo65

# Multi-monitor (comma-separated monitor names)
monitor=eDP-1,HDMI-A-1

# Sleep mode (optional)
idle_sleep_timeout=180
# enable_scheduled_sleep=0
# sleep_begin=01:00
# sleep_end=09:00
