#############################
### ENVIRONMENT VARIABLES ###
#############################

## THEME ##
env = GTK_THEME, Colloid-Dark-Catppuccin # Set default GTK theme
# env = GTK_THEME, MacTahoe-Dark

# CATPPUCCIN
# env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
# env = HYPRCURSOR_SIZE,32
# env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
# env = XCURSOR_SIZE,27

# CAPITAINE
env = HYPRCURSOR_THEME,capitaine-cursors
env = HYPRCURSOR_SIZE,27
# env = XCURSOR_THEME,capitaine-cursors
# env = XCURSOR_SIZE,27

## NVIDIA ##
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct # VA-API Hardware acceleration

# ######## Toolkit backends ########
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ####### XDG specifications #######
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# ############# Others #############
env = _JAVA_AWT_WM_NONREPARENTING, 1
