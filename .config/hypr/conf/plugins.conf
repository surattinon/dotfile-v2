  hyprglass {
    enabled = 0
    default_theme = dark
    default_preset = glass

    brightness = 0.5
    blur_strength = 2
    blur_iterations = 1
    refraction_strength = 0.1
    chromatic_aberration = 0.1
    glass_opacity = 0.2
    edge_thickness = 0.01
    lens_distortion = 0.1
    contrast = 1.1
  }
}

