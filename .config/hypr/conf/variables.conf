###################
### MY PROGRAMS ###
###################

$terminal = foot
$fileManager = thunar
$browser = zen-browser
$screenshot = grim -g "$(slurp -d)" - | wl-copy

# hints
$hints = hints

#############################
### NOCTALIA (shell) BINDS ###
#############################

# Lock screen  — CONFIRMED in source: `session <lock|suspend|lock-and-suspend|logout|reboot|shutdown>`
# $lock = ~/.config/hypr/scripts/hyprlock.sh      # old (kept as fallback)
$lock = qs -c noctalia-shell ipc call lockScreen lock
# App launcher — replaces walker. VERIFY exact name with `noctalia msg --help` (likely `launcher toggle`)
# $launcher = nc -U /run/user/1000/walker/walker.sock   # old
$launcher = noctalia msg panel-toggle launcher

# Clipboard history — replaces vicinae. VERIFY name (Noctalia has a clipboard panel; likely `clipboard toggle`)
# $cliphist = vicinae vicinae://extensions/vicinae/clipboard/history   # old
$cliphist = qs -c noctalia-shell ipc call launcher clipboard

# Power menu — Noctalia session panel replaces the rofi powermenu (optional)
# $powermenu = ~/.config/rofi/bin/powermenu   # old
$powermenu = qs -c noctalia-shell ipc call sessionMenu toggle

# Runner — keep rofi, or point at the Noctalia launcher too (optional)
$runner = ~/.config/rofi/bin/runner

# Waybar reload — obsolete under Noctalia (it hot-reloads). Left harmless; unbind SUPER+SHIFT+B if you like.
$waybarReload = ~/.config/hypr/scripts/waybar-reload.sh
